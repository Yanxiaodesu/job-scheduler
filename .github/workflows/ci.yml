name: CI

# ============================================================
#  两个 job：
#    test —— 起一个 MySQL service container，跑全部单元/集成测试
#    e2e  —— 真的把 jar 跑起来（1 admin + 1 executor），建个任务看它执行
#
#  为什么要有 e2e：单元测试全绿不代表 jar 能启动。
#  配置错、依赖漏、打包出问题，都只有真跑一次才能发现。
# ============================================================

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:

  # ------------------------------------------------------------
  test:
    name: 单元与集成测试
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: job_scheduler
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 建表
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot < sql/schema.sql

      - name: 跑测试
        run: ./mvnw -B test

      - name: 打包
        run: ./mvnw -B package -DskipTests

      - name: 上传 jar
        uses: actions/upload-artifact@v4
        with:
          name: job-scheduler-jar
          path: target/job-scheduler-*.jar
          retention-days: 7

  # ------------------------------------------------------------
  e2e:
    name: 端到端冒烟
    runs-on: ubuntu-latest
    needs: test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: job_scheduler
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 建表
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot < sql/schema.sql

      - name: 打包
        run: ./mvnw -B package -DskipTests

      - name: 启动 Admin
        run: |
          ROLE=admin PORT=8080 INSTANCE_ID=ci-admin APP_NAME=demo SCAN_INTERVAL_MS=200 \
            java -jar target/job-scheduler-*.jar > /tmp/admin.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/api/metrics > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/api/metrics > /dev/null || { cat /tmp/admin.log; exit 1; }

      - name: 启动执行器
        run: |
          ROLE=executor PORT=9001 INSTANCE_ID=ci-exec APP_NAME=demo ADDRESS=http://127.0.0.1:9001 \
            java -jar target/job-scheduler-*.jar > /tmp/exec.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9001/api/metrics > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:9001/api/metrics > /dev/null || { cat /tmp/exec.log; exit 1; }

      - name: 建任务并等待执行
        run: |
          set -e
          curl -sf -X POST http://127.0.0.1:8080/api/jobs \
            -H 'Content-Type: application/json' \
            -d '{"jobName":"ci-smoke","cronExpr":"*/2 * * * * *","handlerType":1,"handlerValue":"printTime","timeoutSec":10,"maxRetry":0,"misfireStrategy":2,"status":1}'
          echo
          echo "等待 20 秒让它跑几轮 ..."
          sleep 20
          echo "--- 实例 ---"
          curl -sf "http://127.0.0.1:8080/api/instances?limit=10"
          echo
          echo "--- 重复检查 ---"
          curl -sf http://127.0.0.1:8080/api/instances/duplicates
          echo

      - name: 断言执行成功且无重复
        run: |
          set -e
          DUP=$(curl -sf http://127.0.0.1:8080/api/instances/duplicates)
          echo "$DUP"
          echo "$DUP" | grep -q '"ok":true' || { echo "有重复实例"; exit 1; }

          M=$(curl -sf http://127.0.0.1:8080/api/metrics)
          echo "$M"
          SUCCESS=$(echo "$M" | grep -o '"success":[0-9]*' | head -1 | cut -d: -f2)
          if [ "${SUCCESS:-0}" -lt 1 ]; then
            echo "没有任何任务执行成功"
            cat /tmp/admin.log
            cat /tmp/exec.log
            exit 1
          fi
          echo "端到端冒烟通过：成功执行 $SUCCESS 次，零重复"

      - name: 失败时打印日志
        if: failure()
        run: |
          echo "======== admin.log ========"
          cat /tmp/admin.log || true
          echo "======== exec.log ========"
          cat /tmp/exec.log || true
